name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions for Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deploy finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node 22 LTS
          cache: npm

      # Provides the real Pages URL: https://<user>.github.io/<repo>,
      # https://<user>.github.io, or the custom domain set in Settings → Pages.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test

      - name: Install Playwright browser
        run: npm run test:e2e:install
      - name: End-to-end tests (on the real base path)
        run: npm run test:e2e
        env:
          E2E_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          DEPLOY_ENV: production

      - name: Verify export
        run: npm run verify:export
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
